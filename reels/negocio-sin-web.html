  const plG = ac.createGain(); plG.gain.value = .5; plF.connect(plG); plG.connect(music); plG.connect(rev);
  const drumsEnd = T.s5 - .15;
  for (let b = 0; b * BAR < DUR; b++) {
    const t0 = b * BAR, ch = chords[b % 4];
    for (const n of ch) for (const det of [-8, 8]) {
      const g = ac.createGain(); g.connect(padF);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.2, t0 + .5); g.gain.setValueAtTime(.2, t0 + BAR - .2); g.gain.linearRampToValueAtTime(0, t0 + BAR + .4);
      osc('sawtooth', midi(n), t0, BAR + .5, g).detune.value = det;
    }
    for (let k = 0; k < 4; k++) {
      const tb = t0 + k * BEAT;
      if (tb >= 2.4 && tb < drumsEnd) {   // bajo pulsado
        const g = ac.createGain(); g.connect(music); env(g, tb, .55, .015, .5); osc('sine', midi(ch[0] - 12), tb, .55, g);
      }
      if (tb >= 2.4 && tb < drumsEnd && k % 2 === 0) {   // bombo
        const g = ac.createGain(); g.connect(music); env(g, tb, .9, .004, .32);
        const o = osc('sine', 140, tb, .35, g); o.frequency.exponentialRampToValueAtTime(42, tb + .14);
      }
      if (tb >= 4.8 && tb < drumsEnd && k % 2 === 1) {   // clap suave
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8;
        const g = ac.createGain(); f.connect(g); g.connect(music); g.connect(rev); env(g, tb, .22, .003, .14); noise(tb, .18, f);
      }
      if (tb + BEAT / 2 < drumsEnd) {   // hi-hat a contratiempo
        const th = tb + BEAT / 2, f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
        const g = ac.createGain(); f.connect(g).connect(music); env(g, th, .09, .002, .05); noise(th, .07, f);
      }
      if (tb >= T.s2) for (const half of [0, BEAT / 2]) {   // arpegio desde la escena 2
        const tp = tb + half, n = ch[(k * 2 + (half ? 1 : 0)) % 3] + 12;
        const g = ac.createGain(); g.connect(plF); env(g, tp, .13, .005, .28); osc('triangle', midi(n), tp, .32, g);
      }
    }
  }

  // ----- efectos -----
  const sfx = ac.createGain(); sfx.gain.value = SFX_VOL; sfx.connect(out);
  const click = (t, v = .3) => {
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
    const g = ac.createGain(); f.connect(g).connect(sfx); env(g, t, v, .001, .025); noise(t, .04, f);
  };
  const pop = (t, v = .35) => { const g = ac.createGain(); g.connect(sfx); env(g, t, v, .004, .12); const o = osc('sine', 520, t, .15, g); o.frequency.exponentialRampToValueAtTime(900, t + .06); };
  const ding = (t, v = .3) => [[1318.5, 0], [1975.5, .09]].forEach(([f, d]) => { const g = ac.createGain(); g.connect(sfx); g.connect(rev); env(g, t + d, v, .004, .6); osc('sine', f, t + d, .7, g); });
  const tick = (t, f, v = .14) => { const g = ac.createGain(); g.connect(sfx); g.connect(rev); env(g, t, v, .003, .18); osc('triangle', f, t, .22, g); };
  const whoosh = (t, v = .5, low = false) => {
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(low ? 200 : 350, t - .35); f.frequency.exponentialRampToValueAtTime(low ? 1400 : 4200, t); f.frequency.exponentialRampToValueAtTime(low ? 300 : 700, t + .3);
    const g = ac.createGain(); f.connect(g); g.connect(sfx); g.connect(rev);
    g.gain.setValueAtTime(0, t - .35); g.gain.linearRampToValueAtTime(v, t); g.gain.linearRampToValueAtTime(0, t + .32);
    noise(t - .35, .7, f);
  };
  const riser = (t0, t1) => {
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(400, t0); f.frequency.exponentialRampToValueAtTime(6000, t1);
    const g = ac.createGain(); f.connect(g).connect(sfx); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.28, t1); g.gain.linearRampToValueAtTime(0, t1 + .05);
    noise(t0, t1 - t0 + .1, f);
  };
  const boom = t => {
    const g = ac.createGain(); g.connect(sfx); env(g, t, 1.0, .005, 1.4); const o = osc('sine', 75, t, 1.5, g); o.frequency.exponentialRampToValueAtTime(36, t + .9);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    const gn = ac.createGain(); f.connect(gn); gn.connect(sfx); gn.connect(rev); env(gn, t, .35, .005, 1.2); noise(t, 1.3, f);
  };
  // escena 1: tipeo, resultados, toque, cambio de página, formulario y confirmación
  for (let i = 0; i < QUERY.length; i++) click(.3 + i * 1.2 / QUERY.length + ((i * 37) % 7) * .004, .16 + ((i * 13) % 5) * .02);
  [1.75, 1.93, 2.11].forEach((t, i) => tick(t, [880, 1046.5, 1318.5][i], .08));
  click(3.78, .5); pop(3.79, .2); whoosh(4.45, .22);
  [[4.6, 6], [4.85, 12], [5.1, 19]].forEach(([t0, n]) => { for (let i = 0; i < n; i++) click(t0 + i * .25 / n, .12); });
  ding(5.6, .22);
  // cortes entre escenas
  whoosh(T.s2, .55); whoosh(T.s3, .55); whoosh(T.s4, .55);
  whoosh(T.s2 + .5, .3, true);                       // la notebook se abre
  pop(8.42, .18);                                     // tooltip 02:14
  for (let i = 0; i < NOTI.length; i++) ding(10.4 + i * .8, .26);   // notificaciones
  [0, 2, 4, 5, 7, 9].forEach((st, i) => tick(T.s4 + .25 + i * .22, midi(69 + st), .12));   // barras
  pop(T.s4 + 1.0, .25);                               // "Web online"
  riser(T.s5 - 1.5, T.s5); boom(T.s5);               // cierre con el logo
}
const mixReady = buildMix().then(b => { voiceMix = b; });
function stopAudio() { if (src) { try { src.stop(); } catch {} src = null; } }
function startAudio() {
  stopAudio(); if (!voiceMix || exporting) return;
  actx.resume(); src = actx.createBufferSource(); src.buffer = voiceMix; src.connect(actx.destination); src.start(0, cur);
}

function loop(now) {
  if (playing && !exporting) {
    const nt = cur + (now - last) / 1000;
    if (nt >= DUR) { setTime(0); startAudio(); } else setTime(nt);
  }
  last = now; requestAnimationFrame(loop);
}
ui.play.onclick = () => { playing = !playing; ui.play.textContent = playing ? 'Pausa' : 'Play'; playing ? startAudio() : stopAudio(); };
ui.scrub.oninput = () => { playing = false; stopAudio(); ui.play.textContent = 'Play'; setTime(+ui.scrub.value); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); ui.play.click(); } });
ui.play.textContent = playing ? 'Pausa' : 'Play';
setTime(cur); requestAnimationFrame(loop);

async function exportVideo() {
  if (exporting) return;
  if (!('VideoEncoder' in window)) { ui.status.textContent = 'Este navegador no soporta WebCodecs (usá Chrome).'; return; }
  stopAudio(); playing = false;
  exporting = true; ui.exp.disabled = true; ui.status.textContent = 'Preparando…';
  try {
    const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm');
    await mixReady;
    const aacCfg = { codec:'mp4a.40.2', sampleRate:SR, numberOfChannels:2, bitrate:160000 };
    const hasAudio = !!voiceMix && 'AudioEncoder' in window && (await AudioEncoder.isConfigSupported(aacCfg)).supported;
    let chosen = null;
    for (const [codec, mc] of [['avc1.640034', 'avc'], ['avc1.4d0034', 'avc'], ['avc1.42003e', 'avc'], ['vp09.00.51.08', 'vp9']]) {
      const s = await VideoEncoder.isConfigSupported({ codec, width:W, height:H, bitrate:BITRATE, framerate:FPS });
      if (s.supported) { chosen = [codec, mc]; break; }
    }
    if (!chosen) throw new Error('Sin codec compatible');
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, video:{ codec:chosen[1], width:W, height:H, frameRate:FPS },
      ...(hasAudio ? { audio:{ codec:'aac', sampleRate:SR, numberOfChannels:2 } } : {}), fastStart:'in-memory' });
    let err = null;
    if (hasAudio) {   // pista de voz → AAC
      const aenc = new AudioEncoder({ output:(c, m) => muxer.addAudioChunk(c, m), error:e => { err = e; } });
      aenc.configure(aacCfg);
      const L = voiceMix.getChannelData(0), R = voiceMix.getChannelData(voiceMix.numberOfChannels > 1 ? 1 : 0);
      const FR = 1024;
      for (let o = 0; o < voiceMix.length; o += FR) {
        const n = Math.min(FR, voiceMix.length - o), data = new Float32Array(n * 2);
        data.set(L.subarray(o, o + n), 0); data.set(R.subarray(o, o + n), n);
        const ad = new AudioData({ format:'f32-planar', sampleRate:SR, numberOfFrames:n, numberOfChannels:2, timestamp:Math.round(o / SR * 1e6), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush();
    }
    const enc = new VideoEncoder({ output:(c, m) => muxer.addVideoChunk(c, m), error:e => { err = e; } });
    enc.configure({ codec:chosen[0], width:W, height:H, bitrate:BITRATE, framerate:FPS, latencyMode:'quality', ...(chosen[1] === 'avc' ? { avc:{ format:'avc' } } : {}) });
    const N = Math.round(DUR * FPS);
    for (let i = 0; i < N; i++) {
      if (err) throw err;
      const t = i / FPS; drawFrame(t);
      const vf = new VideoFrame(out, { timestamp:Math.round(i * 1e6 / FPS), duration:Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame:i % (FPS * 2) === 0 }); vf.close();
      if (enc.encodeQueueSize > 6) await new Promise(r => enc.addEventListener('dequeue', r, { once:true }));
      if (i % 6 === 0) { ui.status.textContent = `Renderizando ${Math.round(i / N * 100)}% (${chosen[0]})`; ui.scrub.value = t; await new Promise(r => setTimeout(r, 0)); }
    }
    await enc.flush(); muxer.finalize();
    const blob = new Blob([target.buffer], { type:'video/mp4' });
    const url = URL.createObjectURL(blob);
    let saved = false;
    try { const r = await fetch('/save?name=' + NAME, { method:'POST', body:blob }); saved = r.ok; } catch {}
    ui.status.innerHTML = `${saved ? 'Guardado en reels/out/ · ' : ''}<a href="${url}" download="${NAME}">Descargar MP4</a> (${(blob.size / 1e6).toFixed(1)} MB, ${chosen[0]})`;
    if (!saved) { const a = document.createElement('a'); a.href = url; a.download = NAME; a.click(); }
    window.__lastExport = { size:blob.size, codec:chosen[0], saved, audio:hasAudio };
  } catch (e) { ui.status.textContent = 'Error: ' + e.message; window.__lastExport = { error:String(e) }; }
  exporting = false; ui.exp.disabled = false;
}
ui.exp.onclick = exportVideo;
window.exportVideo = exportVideo;
window.renderAt = t => { playing = false; setTime(t); };
</script>
